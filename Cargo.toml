[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/marginalia-core", "crates/marginalia-mcp", "crates/marginalia-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
marginalia-core = { path = "crates/marginalia-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
